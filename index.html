<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우당탕탕 포스트카드</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
  height:100vh;
  background:#e6e6e6;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  overflow:hidden;
}

.stage{
  width:100%;
  height:100%;
  max-width:420px;
  background:#f5f5f5;
  perspective:1200px;
  position:relative;
}

.topbar{
  height:56px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.06);
  position:relative;
}

.topbar-title{
  font-weight:900;
  font-size:16px;
  letter-spacing:0.5px;
}

.bgm-btn{
  position:absolute;
  right:14px;
  background:#111;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:8px 12px;
  font-weight:700;
}

.book{
  position:absolute;
  top:56px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.page{
  width:90%;
  height:82%;
  background:#fff;
  border-radius:16px;
  box-shadow:0 18px 40px rgba(0,0,0,.18);
  position:absolute;
  transform-style:preserve-3d;
  overflow:hidden;
}

.page img,
.page video{
  width:100%;
  height:100%;
  object-fit:cover;
  backface-visibility:hidden;
}

.share{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:14px;
  font-weight:800;
}

.share-title{
  font-size:18px;
}

.share-note{
  font-size:13px;
  opacity:.65;
}
</style>
</head>

<body>
<div class="stage">

  <div class="topbar">
    <div class="topbar-title">우당탕탕 포스트카드</div>
    <button class="bgm-btn" id="bgmBtn">🔊</button>
  </div>

  <div class="book">
    <div class="page" id="page"></div>
  </div>

</div>

<audio id="bgm" src="audio/bgm.mp3" loop></audio>
<audio id="flipSound" src="audio/page-flip.wav" preload="auto"></audio>

<script>
const pages = [
  {type:"video", src:"media/intro.mp4"},
  ...Array.from({length:13},(_,i)=>({type:"img", src:`images/photo${i+1}.jpg`})),
  {type:"qr"}
];

let index = 0;
const page = document.getElementById("page");
const flipSound = document.getElementById("flipSound");

const bgm = document.getElementById("bgm");
const bgmBtn = document.getElementById("bgmBtn");
let bgmOn = false;

bgmBtn.onclick = async () => {
  if (!bgmOn) {
    await bgm.play();
    bgmOn = true;
    bgmBtn.textContent = "🔇";
  } else {
    bgm.pause();
    bgmOn = false;
    bgmBtn.textContent = "🔊";
  }
};

function render(){
  page.innerHTML = "";
  const item = pages[index];

  if (item.type === "video") {
    const v = document.createElement("video");
    Object.assign(v, {
      src: item.src,
      autoplay: true,
      muted: true,
      playsInline: true
    });
    page.appendChild(v);
  }

  else if (item.type === "img") {
    const img = document.createElement("img");
    img.src = item.src;
    page.appendChild(img);
  }

  else {
    const div = document.createElement("div");
    div.className = "share";
    div.innerHTML = `
      <div class="share-title">SCAN QR</div>
      <img src="qr/qr.png"
           style="width:180px;height:180px;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.18)">
      <div class="share-note">길게 눌러 저장</div>
      <div class="share-note">해킹 파일 아님 주의</div>
    `;
    page.appendChild(div);
  }
}

render();

// page flip
let startX = 0;
let dx = 0;
let dragging = false;

page.addEventListener("touchstart", e => {
  dragging = true;
  startX = e.touches[0].clientX;
  page.style.transition = "none";
});

page.addEventListener("touchmove", e => {
  if (!dragging) return;
  dx = e.touches[0].clientX - startX;
  page.style.transform = `rotateY(${dx * 0.25}deg)`;
});

page.addEventListener("touchend", () => {
  dragging = false;
  page.style.transition = "transform .6s cubic-bezier(.2,.8,.2,1)";

  if (Math.abs(dx) > 60) {
    flipSound.currentTime = 0;
    flipSound.play();

    if (dx < 0) {
      index = (index + 1) % pages.length;
    } else {
      index = (index - 1 + pages.length) % pages.length;
    }

    page.style.transform = `rotateY(${dx < 0 ? -180 : 180}deg)`;

    setTimeout(() => {
      page.style.transition = "none";
      page.style.transform = "rotateY(0)";
      render();
    }, 600);
  } else {
    page.style.transform = "rotateY(0)";
  }
  dx = 0;
});
</script>
</body>
</html>
