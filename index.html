<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Postcard</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
  height:100vh;
  background:#e6e6e6;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  overflow:hidden;
}

.stage{
  width:100%;
  height:100%;
  max-width:420px;
  background:#f5f5f5;
  perspective:1200px;
  position:relative;
}

.topbar{
  height:52px;
  padding:0 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.05);
}

.topbar span{
  font-weight:800;
  letter-spacing:1px;
}

.btn{
  background:#111;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:8px 12px;
  font-weight:700;
}

.book{
  position:absolute;
  top:52px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.page{
  width:90%;
  height:82%;
  background:#fff;
  border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.18);
  position:absolute;
  transform-style:preserve-3d;
  overflow:hidden;
}

.page img, .page video{
  width:100%;
  height:100%;
  object-fit:cover;
  backface-visibility:hidden;
}

.page.back{
  transform: rotateY(180deg);
}

.share{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100%;
  gap:16px;
  font-weight:800;
}

.share button{
  padding:12px 20px;
  border-radius:12px;
  border:0;
  background:#111;
  color:#fff;
}
</style>
</head>

<body>
<div class="stage">

  <div class="topbar">
    <span>POSTCARD</span>
    <button class="btn" id="bgmBtn">🔊</button>
  </div>

  <div class="book">
    <div class="page" id="page"></div>
  </div>

</div>

<audio id="bgm" src="audio/bgm.mp3" loop></audio>
<audio id="flipSound" src="audio/page-flip.mp3" preload="auto"></audio>

<script>
const pages = [
  {type:"video", src:"media/intro.mp4"},
  ...Array.from({length:13},(_,i)=>({type:"img", src:`images/photo${i+1}.jpg`})),
  {type:"share"}
];

let index=0;
const page=document.getElementById("page");
const flipSound=document.getElementById("flipSound");

const bgm=document.getElementById("bgm");
const bgmBtn=document.getElementById("bgmBtn");
let bgmOn=false;

bgmBtn.onclick=async()=>{
  if(!bgmOn){ await bgm.play(); bgmOn=true; bgmBtn.textContent="🔇"; }
  else{ bgm.pause(); bgmOn=false; bgmBtn.textContent="🔊"; }
};

function render(){
  page.innerHTML="";
  const item=pages[index];

  if(item.type==="video"){
    const v=document.createElement("video");
    Object.assign(v,{src:item.src,autoplay:true,muted:true,playsInline:true});
    page.appendChild(v);
  }
  else if(item.type==="img"){
    const img=document.createElement("img");
    img.src=item.src;
    page.appendChild(img);
  }
  else{
    const div=document.createElement("div");
    div.className="share";
    div.innerHTML=`
      <div>공유하기</div>
      <button onclick="navigator.clipboard.writeText(location.href)">링크 복사</button>
      <button onclick="alert('QR은 이미 인쇄된 QR을 사용하세요')">QR 저장</button>
    `;
    page.appendChild(div);
  }
}

render();

// 책장 넘김 로직
let sx=0, dx=0, dragging=false;

page.addEventListener("touchstart",e=>{
  dragging=true;
  sx=e.touches[0].clientX;
  page.style.transition="none";
});

page.addEventListener("touchmove",e=>{
  if(!dragging)return;
  dx=e.touches[0].clientX-sx;
  page.style.transform=`rotateY(${dx*.25}deg)`;
});

page.addEventListener("touchend",()=>{
  dragging=false;
  page.style.transition="transform .6s cubic-bezier(.2,.8,.2,1)";

  if(Math.abs(dx)>60){
    flipSound.currentTime=0;
    flipSound.play();

    if(dx<0){
      index=(index+1)%pages.length;
    }else{
      index=(index-1+pages.length)%pages.length;
    }

    page.style.transform=`rotateY(${dx<0?-180:180}deg)`;

    setTimeout(()=>{
      page.style.transition="none";
      page.style.transform="rotateY(0)";
      render();
    },600);
  }else{
    page.style.transform="rotateY(0)";
  }
  dx=0;
});
</script>
</body>
</html>
