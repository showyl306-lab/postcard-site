<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Postcard</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  height:100vh;
  background:#eaeaea;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  overflow:hidden;
}

.stage {
  width:100%;
  height:100%;
  max-width:420px;
  background:#f5f5f5;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar {
  height:52px;
  padding:0 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(0,0,0,0.05);
}

.topbar span {
  font-weight:800;
  font-size:14px;
  letter-spacing:1px;
}

.btn {
  background:#111;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:8px 12px;
  font-weight:700;
  cursor:pointer;
}

.content {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.stack {
  position:absolute;
  width:90%;
  height:82%;
  border-radius:16px;
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
  transform:translateY(14px) scale(.97);
}

.stack.back {
  transform:translateY(26px) scale(.94);
  opacity:.6;
}

.card {
  width:90%;
  height:82%;
  background:#fff;
  border-radius:16px;
  box-shadow:0 18px 40px rgba(0,0,0,.18);
  overflow:hidden;
  position:absolute;
  touch-action:pan-y;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s;
}

.card img, .card video {
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

.end {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:16px;
  height:100%;
  font-weight:700;
}

.end button {
  padding:12px 20px;
  border-radius:12px;
  border:0;
  background:#111;
  color:#fff;
  font-weight:800;
}
</style>
</head>

<body>
<div class="stage">

  <div class="topbar">
    <span>POSTCARD</span>
    <button class="btn" id="bgmBtn">🔊</button>
  </div>

  <div class="content">
    <div class="stack back"></div>
    <div class="stack"></div>
    <div class="card" id="card"></div>
  </div>
</div>

<audio id="bgm" src="audio/bgm.mp3" loop></audio>

<script>
const items = [
  { type:"video", src:"media/intro.mp4" },
  ...Array.from({length:13},(_,i)=>({ type:"image", src:`images/photo${i+1}.jpg` })),
  { type:"end" }
];

let index = 0;
const card = document.getElementById("card");
const bgm = document.getElementById("bgm");
const bgmBtn = document.getElementById("bgmBtn");
let bgmOn=false;

bgmBtn.onclick=async()=>{
  if(!bgmOn){ await bgm.play(); bgmOn=true; bgmBtn.textContent="🔇"; }
  else{ bgm.pause(); bgmOn=false; bgmBtn.textContent="🔊"; }
};

function render(){
  card.innerHTML="";
  const item=items[index];

  if(item.type==="video"){
    const v=document.createElement("video");
    Object.assign(v,{src:item.src,autoplay:true,muted:true,playsInline:true});
    card.appendChild(v);
  }
  else if(item.type==="image"){
    const img=document.createElement("img");
    img.src=item.src;
    card.appendChild(img);
  }
  else{
    const end=document.createElement("div");
    end.className="end";
    end.innerHTML=`
      <div>끝</div>
      <button onclick="location.reload()">처음으로</button>
    `;
    card.appendChild(end);
  }
}

render();

let sx=0, dx=0, dragging=false;
const threshold=70;

card.addEventListener("touchstart",e=>{
  dragging=true;
  sx=e.touches[0].clientX;
  card.style.transition="none";
});

card.addEventListener("touchmove",e=>{
  if(!dragging)return;
  dx=e.touches[0].clientX-sx;
  card.style.transform=`translateX(${dx}px) rotate(${dx*.04}deg)`;
});

card.addEventListener("touchend",()=>{
  dragging=false;
  card.style.transition="transform .28s, opacity .28s";

  if(Math.abs(dx)>threshold){
    const dir=dx>0?1:-1;
    card.style.transform=`translateX(${dir*140}%) rotate(${dir*18}deg)`;
    card.style.opacity=0;

    setTimeout(()=>{
      index=Math.min(index+1,items.length-1);
      card.style.transition="none";
      card.style.opacity=1;
      card.style.transform="translateX(0)";
      render();
    },260);
  }else{
    card.style.transform="translateX(0)";
  }
  dx=0;
});
</script>
</body>
</html>
