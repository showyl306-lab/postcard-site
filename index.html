<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postcard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #eaeaea;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stage {
      width: 100%;
      height: 100%;
      max-width: 420px; /* 모바일 기준 */
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      height: 80%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="card">
      <img src="https://picsum.photos/800/1200" alt="postcard">
    </div>
  </div>
</body>
</html>
